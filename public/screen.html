<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Brew House — Selfie Wall</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #1b1109 url("assets/wall.jpg") center / cover no-repeat;
    color: var(--cream);
    display: flex;
    flex-direction: column;
  }

  /* Darken the generated wall so the lamp hotspots never fight the artwork. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 20%, rgba(12, 7, 4, 0.72) 100%),
      rgba(20, 12, 7, 0.35);
    pointer-events: none;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.6vh;
    padding: 1.5vh 0 1.2vh;
    border-bottom: 2px solid rgba(201, 151, 63, 0.35);
    background: rgba(0, 0, 0, 0.32);
    position: relative;
  }

  .crest {
    width: 6.4vh;
    height: 6.4vh;
    flex: none;
  }

  .brand {
    font-family: var(--serif);
    font-size: 3.7vh;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--cream);
  }

  .brand em {
    color: var(--gold-light);
    font-style: normal;
  }

  .tagline {
    margin: 0.4vh 0 0;
    font-size: 1.5vh;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .stage {
    flex: 1;
    display: grid;
    place-items: center;
    position: relative;
    min-height: 0;
  }

  /* Two framed layers stacked in one grid cell. Rotating crossfades between
     them, so the wall never dips to an empty stage the way a single fading
     layer does. */
  .deck {
    display: grid;
    place-items: center;
    /* One pixel of assets/frame.png. fitFrame() overwrites this at runtime so
       the frame fills the stage; the calc is only a pre-measure fallback. */
    --u: calc(1vh / 9.8);
  }

  .layer {
    /* .template declares its own --u: 1px fallback, which would shadow the
       deck's value — take the inherited one instead. */
    --u: inherit;
    grid-area: 1 / 1;
    opacity: 0;
    transform: scale(0.985);
    transition: opacity 0.9s var(--ease), transform 1.6s var(--ease);
    pointer-events: none;
  }

  .layer.is-front {
    opacity: 1;
    transform: scale(1);
  }

  /* ---- empty state ---- */

  .placeholder {
    text-align: center;
    max-width: 60vw;
  }

  .placeholder__cup {
    width: 22vh;
    height: 22vh;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
  }

  .placeholder__title {
    font-family: var(--serif);
    font-size: 6vh;
    margin: 2vh 0 1vh;
    color: var(--gold-light);
  }

  .placeholder__sub {
    font-size: 2.6vh;
    color: rgba(247, 239, 225, 0.7);
    margin: 0;
  }


  /* ---- QR corner card ---- */

  .qr {
    position: fixed;
    right: 3vh;
    bottom: 3vh;
    width: 26vh;
    background: var(--cream);
    border: 0.6vh solid var(--gold);
    border-radius: 1.4vh;
    padding: 1.6vh;
    text-align: center;
    color: var(--coffee);
    box-shadow: 0 1.6vh 4vh rgba(0, 0, 0, 0.5);
  }

  .qr img {
    display: block;
    width: 100%;
    border-radius: 0.6vh;
  }

  .qr__title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 2.2vh;
    margin: 1.2vh 0 0.3vh;
  }

  .qr__sub {
    font-size: 1.5vh;
    color: var(--muted);
    margin: 0;
    word-break: break-all;
  }

  /* ---- rotation progress + counter ---- */

  .counter {
    position: fixed;
    left: 3vh;
    bottom: 3vh;
    font-size: 1.9vh;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(247, 239, 225, 0.55);
  }

  .progress {
    position: fixed;
    left: 0;
    bottom: 0;
    height: 0.5vh;
    width: 0;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
  }

  /* ---- kiosk controls ----
     Hidden during normal use and revealed by any interaction, so the wall
     looks untouched on the TV but staff can flip modes at the screen. */

  .control {
    position: fixed;
    top: 3vh;
    right: 3vh;
    display: flex;
    align-items: center;
    gap: 1.2vh;
    padding: 1.2vh 1.6vh;
    border-radius: var(--r-pill);
    background: rgba(20, 12, 7, 0.86);
    border: 1px solid rgba(201, 151, 63, 0.5);
    box-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(-1vh);
    pointer-events: none;
    transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease);
  }

  .control.is-visible {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .control__label {
    font-size: 1.5vh;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .control__btn {
    font: inherit;
    font-size: 1.6vh;
    font-weight: 700;
    padding: 0.9vh 1.8vh;
    border-radius: var(--r-pill);
    border: 1px solid rgba(201, 151, 63, 0.45);
    background: transparent;
    color: rgba(247, 239, 225, 0.75);
    cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }

  .control__btn:hover:not([aria-pressed="true"]) {
    border-color: var(--gold);
    color: var(--cream);
  }

  .control__btn[aria-pressed="true"] {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--espresso);
  }

  .control__hint {
    font-size: 1.3vh;
    color: rgba(247, 239, 225, 0.45);
  }

  /* The cursor is noise on a TV; it comes back with any movement. */
  body.is-idle {
    cursor: none;
  }

  /* Shown only after polling has failed repeatedly, so a blip doesn't nag but
     a genuinely dead server is visible to staff from across the room. */
  .offline {
    position: fixed;
    top: 50%;
    right: 3vh;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 1vh;
    padding: 1vh 1.8vh;
    border-radius: var(--r-pill);
    background: rgba(162, 69, 47, 0.92);
    color: #fff;
    font-size: 1.7vh;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.5);
    transition: opacity var(--slow) var(--ease);
  }

  .offline__dot {
    width: 1.1vh;
    height: 1.1vh;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
</style>
</head>
<body>

<header>
  <img class="crest" src="assets/emblem.png" alt="">
  <div>
    <h1 class="brand">The Brew House <em>—</em> Selfie Wall</h1>
    <p class="tagline">Freshly brewed &amp; freshly posted</p>
  </div>
</header>

<main class="stage">
  <div id="deck" class="deck hidden" aria-live="polite">
    <div class="template layer" data-layer="0">
      <img class="template__photo" alt="">
      <div class="template__rule"></div>
      <p class="template__name"></p>
      <p class="template__message"></p>
    </div>
    <div class="template layer" data-layer="1">
      <img class="template__photo" alt="">
      <div class="template__rule"></div>
      <p class="template__name"></p>
      <p class="template__message"></p>
    </div>
  </div>

  <div id="placeholder" class="placeholder">
    <img class="placeholder__cup" src="assets/emblem.png" alt="">
    <h2 class="placeholder__title">Scan QR to be featured!</h2>
    <p class="placeholder__sub">Snap a selfie, add your name, and you'll appear right here on the wall.</p>
  </div>
</main>

<aside class="qr">
  <img id="qr-img" alt="QR code linking to the selfie upload page">
  <p class="qr__title">Scan to join the wall</p>
  <p class="qr__sub" id="qr-target"></p>
</aside>

<div class="control" id="control">
  <span class="control__label">Wall</span>
  <button class="control__btn" type="button" data-mode="loop">Looping</button>
  <button class="control__btn" type="button" data-mode="live">Live</button>
  <span class="control__hint">press L</span>
</div>

<div class="counter" id="counter"></div>
<div class="progress" id="progress"></div>
<div class="offline hidden" id="offline"><span class="offline__dot"></span>Reconnecting</div>

<script>
const ROTATE_MS = 8000;
const POLL_MS = 3000;
/* Two consecutive failures before crying wolf — a single dropped poll on a
   cafe wifi is not worth a banner on the wall. */
const OFFLINE_AFTER = 2;

const el = {
  deck: document.getElementById('deck'),
  placeholder: document.getElementById('placeholder'),
  counter: document.getElementById('counter'),
  progress: document.getElementById('progress'),
  offline: document.getElementById('offline'),
  title: document.querySelector('.placeholder__title'),
  sub: document.querySelector('.placeholder__sub'),
  stage: document.querySelector('.stage'),
  qr: document.querySelector('.qr'),
};

const layers = [...document.querySelectorAll('.layer')].map((root) => ({
  root,
  photo: root.querySelector('.template__photo'),
  name: root.querySelector('.template__name'),
  message: root.querySelector('.template__message'),
}));

let queue = [];        // what the wall is currently cycling (mode-filtered)
let index = 0;
let front = 0;
let rotateTimer = null;
let failures = 0;
let wall = { mode: 'loop', liveSince: null };
let lastMode = 'loop';

/* ---- QR code ---- */

fetch('/api/qr')
  .then((r) => r.json())
  .then(({ dataUrl, target }) => {
    document.getElementById('qr-img').src = dataUrl;
    document.getElementById('qr-target').textContent = target;
  })
  .catch(() => {});

/* ---- polling ---- */

const signature = (list) => list.map((s) => s.id).join(',');

async function poll() {
  try {
    const [qRes, wRes] = await Promise.all([fetch('/api/queue'), fetch('/api/wall')]);
    if (!qRes.ok || !wRes.ok) throw new Error('poll failed');
    const approved = await qRes.json();
    wall = await wRes.json();
    failures = 0;
    el.offline.classList.add('hidden');

    const next = eligible(approved);
    // A mode switch has to re-seat the wall even when the photo list is
    // unchanged — otherwise going back to loop would leave rotation stopped.
    const switched = wall.mode !== lastMode;
    lastMode = wall.mode;
    renderControl();
    if (switched) {
      queue = [];
      index = 0;
      applyQueue(next);
    } else if (signature(next) !== signature(queue)) {
      applyQueue(next);
    } else {
      updateCounter();
    }
  } catch (err) {
    // Keep showing the last known queue; only flag a sustained outage.
    failures += 1;
    if (failures >= OFFLINE_AFTER) el.offline.classList.remove('hidden');
  }
}

/**
 * In live mode the wall stops replaying the backlog: only photos approved
 * after the switch are eligible, newest last, and rotation stays off so the
 * most recent arrival simply holds the screen.
 */
function eligible(approved) {
  if (wall.mode !== 'live') return approved;
  const since = wall.liveSince || 0;
  const fresh = approved.filter((s) => (s.decidedAt || 0) > since);
  return fresh.length ? [fresh[fresh.length - 1]] : [];
}

function applyQueue(next) {
  const currentId = queue[index]?.id;
  const wasEmpty = queue.length === 0;
  queue = next;
  // Warm the cache so a photo is never still downloading when we fade it in.
  for (const item of queue) new Image().src = item.url;

  if (queue.length === 0) {
    index = 0;
    stopRotation();
    showEmpty();
    return;
  }

  if (wall.mode === 'live') {
    // Newest arrival takes the screen and holds it; nothing cycles.
    index = 0;
    stopRotation();
    show(0, { instant: wasEmpty });
    return;
  }

  // Hold on the photo that's currently up if it survived the update.
  const stillThere = queue.findIndex((s) => s.id === currentId);
  index = stillThere === -1 ? 0 : stillThere;

  if (wasEmpty || stillThere === -1) {
    show(index, { instant: wasEmpty });
    startRotation();
  } else {
    updateCounter();
  }
}

/* ---- rotation ---- */

function startRotation() {
  stopRotation();
  if (wall.mode === 'live') return;
  restartProgress();
  if (queue.length > 1) rotateTimer = setInterval(advance, ROTATE_MS);
}

function stopRotation() {
  clearInterval(rotateTimer);
  rotateTimer = null;
  el.progress.style.transition = 'none';
  el.progress.style.width = '0';
}

function advance() {
  index = (index + 1) % queue.length;
  show(index);
  restartProgress();
}

function restartProgress() {
  el.progress.style.transition = 'none';
  el.progress.style.width = '0';
  if (queue.length < 2) return;
  requestAnimationFrame(() => {
    el.progress.style.transition = `width ${ROTATE_MS}ms linear`;
    el.progress.style.width = '100%';
  });
}

/* ---- render ---- */

/**
 * Paints a photo into the back layer and crossfades it forward, so the
 * outgoing and incoming photos overlap instead of dipping through an empty
 * stage. `instant` skips the fade for the very first photo.
 */
function show(i, { instant = false } = {}) {
  const item = queue[i];
  if (!item) return showEmpty();

  el.placeholder.classList.add('hidden');
  el.deck.classList.remove('hidden');

  const back = instant ? layers[front] : layers[1 - front];
  back.photo.src = item.url;
  back.photo.alt = `Selfie from ${item.name}`;
  back.name.textContent = item.name;
  back.message.textContent = item.message || '';
  back.message.style.display = item.message ? '' : 'none';

  if (!instant) front = 1 - front;
  layers.forEach((l, n) => l.root.classList.toggle('is-front', n === front));
  fitFrame();
  updateCounter();
}

/**
 * Scales the frame to fill the stage.
 *
 * The frame's height depends on how far the name and message wrap, so it can't
 * be derived from the viewport alone. Instead measure the laid-out frame at a
 * known --u and scale from there: every dimension inside the template is a
 * multiple of --u, so height is linear in it and one pass converges exactly.
 */
function fitFrame() {
  if (el.deck.classList.contains('hidden')) return;
  const layer = layers[front].root;

  el.deck.style.setProperty('--u', '1px');
  const h = layer.offsetHeight;
  const w = layer.offsetWidth;
  if (!h || !w) return;

  // Keep clear of the QR card and the counter sitting in the bottom corners.
  const availH = el.stage.clientHeight * 0.97;
  const availW = el.stage.clientWidth - 2 * (el.qr.offsetWidth + 40);
  el.deck.style.setProperty('--u', `${Math.min(availH / h, availW / w)}px`);
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitFrame, 150);
});

function showEmpty() {
  el.deck.classList.add('hidden');
  layers.forEach((l) => l.root.classList.remove('is-front'));
  el.placeholder.classList.remove('hidden');
  el.counter.textContent = '';
  const live = wall.mode === 'live';
  el.title.textContent = live ? 'Ready for your selfie!' : 'Scan QR to be featured!';
  el.sub.textContent = live
    ? 'The wall is waiting — the next approved photo goes straight up here.'
    : "Snap a selfie, add your name, and you'll appear right here on the wall.";
}

function updateCounter() {
  if (!queue.length) return void (el.counter.textContent = '');
  el.counter.textContent =
    wall.mode === 'live' ? 'Live — showing the latest photo' : `${index + 1} of ${queue.length} on the wall`;
}

/* ---- kiosk controls ---- */

const IDLE_MS = 4000;
const control = document.getElementById('control');
let idleTimer = null;

function renderControl() {
  for (const btn of control.querySelectorAll('.control__btn')) {
    btn.setAttribute('aria-pressed', String(btn.dataset.mode === wall.mode));
  }
}

function wake() {
  control.classList.add('is-visible');
  document.body.classList.remove('is-idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    control.classList.remove('is-visible');
    document.body.classList.add('is-idle');
  }, IDLE_MS);
}

async function setMode(mode) {
  if (mode === wall.mode) return;
  wall = { ...wall, mode };   // reflect the press immediately
  renderControl();
  try {
    await fetch('/api/wall', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    });
  } catch (err) {
    /* poll() reconciles against the server either way */
  }
  poll();
}

control.addEventListener('click', (e) => {
  const btn = e.target.closest('.control__btn');
  if (btn) setMode(btn.dataset.mode);
});

for (const evt of ['mousemove', 'touchstart', 'keydown']) {
  window.addEventListener(evt, wake, { passive: true });
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'l' || e.key === 'L') setMode(wall.mode === 'live' ? 'loop' : 'live');
});

document.body.classList.add('is-idle');
renderControl();

showEmpty();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
