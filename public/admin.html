<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderation — Selfie Wall</title>
<base href="/">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/admin.css">
<style>
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
    gap: 2rem;
    align-items: start;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }

  h2 {
    font-family: var(--serif);
    font-size: 1.15rem;
    margin: 0 0 0.9rem;
    color: var(--coffee);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .count {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: var(--gold);
    color: #fff;
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
  }

  /* ---- automatic filter status ---- */

  .filter-note {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.82rem;
    line-height: 1.45;
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    margin: 0 0 var(--s4);
    background: rgba(93, 138, 90, 0.12);
    border: 1px solid rgba(93, 138, 90, 0.4);
    color: var(--mocha);
  }

  /* Filter off means every photo here is unvetted — say so loudly. */
  .filter-note[data-state="off"] {
    background: rgba(201, 151, 63, 0.14);
    border-color: rgba(201, 151, 63, 0.55);
  }

  .filter-note b {
    color: var(--coffee);
  }

  /* Per-row marker for the one case that matters: the filter is on, but this
     photo slipped through while it was unreachable. */
  .meta__unchecked {
    display: inline-block;
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #8a4a24;
    background: rgba(201, 151, 63, 0.2);
    border: 1px solid rgba(201, 151, 63, 0.6);
    border-radius: var(--r-pill);
    padding: 0.15rem 0.55rem;
  }

  /* ---- filter tabs ---- */

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s2);
    margin: 0 0 var(--s4);
  }

  .tab {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--cream-deep);
    border-radius: var(--r-pill);
    background: #fff;
    color: var(--mocha);
    cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
      border-color var(--fast) var(--ease);
  }

  .tab:hover {
    border-color: var(--gold);
  }

  .tab[aria-selected="true"] {
    background: var(--coffee);
    border-color: var(--coffee);
    color: var(--cream);
  }

  .tab__n {
    font-size: 0.72rem;
    padding: 0.1rem 0.45rem;
    border-radius: var(--r-pill);
    background: var(--cream-deep);
    color: var(--coffee);
  }

  .tab[aria-selected="true"] .tab__n {
    background: var(--gold);
    color: var(--espresso);
  }

  /* ---- submission rows ---- */

  .row {
    display: flex;
    gap: 1rem;
    align-items: center;
    background: #fff;
    border: 1px solid var(--cream-deep);
    border-left: 5px solid var(--muted);
    border-radius: 12px;
    padding: 0.85rem;
    margin-bottom: 0.85rem;
    box-shadow: var(--shadow-card);
    transition: box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease);
  }

  .row:hover {
    box-shadow: var(--shadow-lift);
  }

  /* Fades a row out the moment it is filtered away by a decision. */
  .row.is-leaving {
    opacity: 0;
    transform: translateX(12px);
  }

  @media (max-width: 560px) {
    .row {
      flex-wrap: wrap;
    }

    .actions {
      flex-direction: row;
      width: 100%;
    }

    .actions .btn {
      flex: 1;
    }
  }

  .row[data-status="pending"]  { border-left-color: var(--gold); }
  .row[data-status="approved"] { border-left-color: var(--ok); }
  .row[data-status="rejected"] { border-left-color: var(--bad); opacity: 0.65; }

  .thumb {
    width: 72px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid var(--gold);
    background: var(--cream-deep);
    flex: none;
  }

  .meta {
    flex: 1;
    min-width: 0;
  }

  .meta__name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0;
    color: var(--coffee);
  }

  .meta__message {
    font-style: italic;
    color: var(--mocha);
    margin: 0.2rem 0 0;
    font-size: 0.9rem;
    overflow-wrap: anywhere;
  }

  .meta__time {
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    flex: none;
  }

  .actions .btn {
    font-size: 0.82rem;
    padding: 0.5rem 0.95rem;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .badge[data-status="approved"] { background: rgba(78, 125, 63, 0.15); color: var(--ok); }
  .badge[data-status="rejected"] { background: rgba(162, 69, 47, 0.15); color: var(--bad); }

  /* ---- wall mode control ---- */

  .wall {
    background: #fff;
    border: 1px solid var(--cream-deep);
    border-radius: var(--r-md);
    padding: 1rem;
    box-shadow: var(--shadow-card);
    margin-bottom: var(--s5);
  }

  .wall__modes {
    display: flex;
    gap: var(--s2);
    margin-bottom: var(--s3);
  }

  .wall__btn {
    flex: 1;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.6rem 0.5rem;
    border: 1px solid var(--cream-deep);
    border-radius: var(--r-sm);
    background: #fff;
    color: var(--mocha);
    cursor: pointer;
    min-height: 44px;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
      border-color var(--fast) var(--ease);
  }

  .wall__btn:hover:not([aria-pressed="true"]) {
    border-color: var(--gold);
  }

  .wall__btn[aria-pressed="true"] {
    background: var(--coffee);
    border-color: var(--coffee);
    color: var(--cream);
  }

  .wall__hint {
    margin: 0;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--muted);
  }

  /* ---- danger zone ---- */

  .danger {
    margin-top: var(--s5);
    padding-top: var(--s4);
    border-top: 1px dashed var(--cream-deep);
  }

  .danger__btn {
    width: 100%;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.65rem 0.5rem;
    min-height: 44px;
    border-radius: var(--r-sm);
    border: 1px solid var(--bad);
    background: #fff;
    color: var(--bad);
    cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }

  .danger__btn:hover:not(:disabled) {
    background: rgba(162, 69, 47, 0.08);
  }

  /* Second state: the click that actually deletes is visually distinct from
     the one that only arms it. */
  .danger__btn.is-armed {
    background: var(--bad);
    color: #fff;
  }

  .danger__btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .danger__note {
    margin: var(--s2) 0 0;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--muted);
  }

  /* ---- queue sidebar ---- */

  .queue {
    background: #fff;
    border: 1px solid var(--cream-deep);
    border-radius: var(--r-md);
    padding: 1rem;
    box-shadow: var(--shadow-card);
    position: sticky;
    top: 1.5rem;
  }

  .queue ol {
    list-style: none;
    counter-reset: slot;
    margin: 0;
    padding: 0;
  }

  .queue li {
    counter-increment: slot;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.5rem 0;
    border-bottom: 1px dashed var(--cream-deep);
  }

  .queue li:last-child {
    border-bottom: none;
  }

  .queue li::before {
    content: counter(slot);
    flex: none;
    width: 1.6rem;
    height: 1.6rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .queue img {
    width: 30px;
    height: 38px;
    object-fit: cover;
    border-radius: 4px;
    flex: none;
  }

  .queue span {
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    margin: 0;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__inner">
    <h1 class="top__brand">Selfie Wall <span class="top__where" id="shell-where"></span></h1>
    <nav class="top__nav" id="shell-nav"></nav>
  </div>
</header>

<main>
  <section>
    <h2>Submissions <span class="count" id="sub-count">0</span></h2>
    <p class="filter-note hidden" id="filter-note"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="list" aria-live="polite"></div>
  </section>

  <aside>
  <section class="wall">
    <h2>Wall mode</h2>
    <div class="wall__modes" id="wall-modes"></div>
    <p class="wall__hint" id="wall-hint"></p>
  </section>

  <div class="queue">
    <h2>On the wall <span class="count" id="queue-count">0</span></h2>
    <ol id="queue"></ol>
    <p class="empty hidden" id="queue-empty">Nothing approved yet.</p>

    <div class="danger">
      <button class="danger__btn" type="button" id="clear-btn">Clear all photos</button>
      <p class="danger__note" id="clear-note">Deletes every submission and its photo. Cannot be undone.</p>
    </div>
  </div>
  </aside>
</main>

<script type="module">
import { shell, api, boot, flash } from '/admin-shell.js';

const POLL_MS = 6000;
const $ = (id) => document.getElementById(id);

const cafeId = location.pathname.split('/')[2];
/** Every call on this page is scoped to one cafe. */
const at = (suffix) => `/api/cafes/${cafeId}${suffix}`;

await boot({
  where: 'Moderation',
  nav: [
    { href: '/admin/cafes', label: 'Cafes', ownerOnly: true },
    { href: `/admin/${cafeId}`, label: 'Moderation' },
    { href: `/admin/${cafeId}/board`, label: 'Board' },
    { href: `/${cafeId}`, label: 'Screen ↗', blank: true },
    { href: `/${cafeId}/upload`, label: 'Upload ↗', blank: true },
  ],
});

const cafe = shell.cafes.find((c) => c.id === cafeId);
if (cafe) $('shell-where').textContent = `${cafe.name} · Moderation`;

const FILTERS = [
  { key: 'pending', label: 'Needs review' },
  { key: 'approved', label: 'Approved' },
  { key: 'rejected', label: 'Rejected' },
  { key: 'all', label: 'All' },
];

let filter = 'pending';
let submissions = [];
let wall = { mode: 'loop', liveSince: null };
/* Whether the automatic filter is running. Fetched once — it comes from the
   server's environment and cannot change while the process is up. */
let autoFilter = null;
/* Ids the moderator just decided on, so a click updates instantly instead of
   waiting up to 3s for the next poll to catch up. */
const pendingDecisions = new Map();

async function refresh() {
  try {
    const [subs, queue, wallState] = await Promise.all([
      api(at('/submissions')),
      api(at('/queue')),
      api(at('/wall')),
    ]);
    wall = wallState;
    // Drop optimistic entries the server has now confirmed.
    for (const s of subs) {
      if (pendingDecisions.get(s.id) === s.status) pendingDecisions.delete(s.id);
    }
    submissions = subs.map((s) =>
      pendingDecisions.has(s.id) ? { ...s, status: pendingDecisions.get(s.id) } : s
    );
    render();
    renderQueue(queue);
    renderWall();
  } catch (err) {
    /* Leave the last good render on screen and retry next tick. */
  }
}

function counts() {
  const n = { all: submissions.length, pending: 0, approved: 0, rejected: 0 };
  for (const s of submissions) n[s.status] = (n[s.status] || 0) + 1;
  return n;
}

function render() {
  renderTabs();
  renderSubmissions();
}

/**
 * Says plainly whether anything was screened before it got here. A moderator
 * who assumes an automatic filter that is switched off is the failure mode
 * worth spending a banner on.
 */
async function loadFilterState() {
  try {
    const health = await api('/api/health');
    autoFilter = health.moderation || { enabled: false };
  } catch (err) {
    return;
  }

  const note = $('filter-note');
  note.dataset.state = autoFilter.enabled ? 'on' : 'off';
  note.textContent = autoFilter.enabled
    ? 'Names, messages and photos are screened automatically before they reach this page. Flagged uploads are refused and never appear here — you are the second pass, not the first.'
    : 'Automatic screening is off, so nothing below has been checked. Every photo needs your eyes.';
  note.classList.remove('hidden');
  render();
}

function renderTabs() {
  const n = counts();
  const tabs = $('tabs');
  tabs.innerHTML = '';
  for (const f of FILTERS) {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(f.key === filter));
    btn.append(f.label);
    const badge = document.createElement('span');
    badge.className = 'tab__n';
    badge.textContent = n[f.key] || 0;
    btn.append(badge);
    btn.addEventListener('click', () => { filter = f.key; render(); });
    tabs.append(btn);
  }
}

function renderSubmissions() {
  $('sub-count').textContent = submissions.length;
  const list = $('list');
  const shown = submissions.filter((s) => filter === 'all' || s.status === filter);

  if (!shown.length) {
    const EMPTY = {
      pending: 'All caught up — nothing waiting for review.',
      approved: 'Nothing approved yet.',
      rejected: 'Nothing rejected.',
      all: 'No submissions yet — open the upload page and send one through.',
    };
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = submissions.length ? EMPTY[filter] : EMPTY.all;
    list.replaceChildren(p);
    return;
  }

  list.innerHTML = '';
  for (const item of shown) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.status = item.status;

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = item.url;
    thumb.loading = 'lazy';
    thumb.alt = `Selfie from ${item.name}`;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('p');
    name.className = 'meta__name';
    name.textContent = item.name;
    const message = document.createElement('p');
    message.className = 'meta__message';
    message.textContent = item.message || '—';
    const time = document.createElement('p');
    time.className = 'meta__time';
    time.textContent = new Date(item.submittedAt).toLocaleTimeString();
    meta.append(name, message, time);

    /* Only when the filter is meant to be running. With it off the banner
       already says nothing was checked, and a badge on every row is noise. */
    if (autoFilter?.enabled && item.moderation && item.moderation.checked === false) {
      const warn = document.createElement('p');
      warn.className = 'meta__unchecked';
      warn.textContent = '⚠ arrived unscreened';
      warn.title = `The automatic filter could not check this one (${describeSkips(item.moderation)}), so it came through unverified.`;
      meta.append(warn);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (item.status === 'pending') {
      actions.append(
        button('Approve', 'btn--approve', () => decide(item.id, 'approve')),
        button('Reject', 'btn--reject', () => decide(item.id, 'reject')),
      );
    } else {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.dataset.status = item.status;
      badge.textContent = item.status;
      actions.append(badge);
    }

    row.append(thumb, meta, actions);
    list.append(row);
  }
}

const SKIP_COPY = {
  timeout: 'the check timed out',
  network: 'the filter was unreachable',
  'bad-response': 'the filter returned nothing usable',
  'too-large': 'the photo was too big to send',
  'unsupported-type': 'that image format cannot be screened',
  'no-api-key': 'no API key was configured',
};

function describeSkips(moderation) {
  const skipped = moderation.skipped || [];
  if (!skipped.length) return 'reason not recorded';
  return skipped
    .map((s) => SKIP_COPY[s.reason] || (s.reason.startsWith('http-') ? `the filter returned ${s.reason.slice(5)}` : s.reason))
    .join('; ');
}

function button(label, variant, onClick) {
  const btn = document.createElement('button');
  btn.className = `btn ${variant}`;
  btn.type = 'button';
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function renderQueue(queue) {
  $('queue-count').textContent = queue.length;
  $('queue-empty').classList.toggle('hidden', queue.length > 0);

  const ol = $('queue');
  ol.innerHTML = '';
  for (const item of queue) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.src = item.url;
    img.loading = 'lazy';
    img.alt = '';
    const span = document.createElement('span');
    span.textContent = item.name;
    li.append(img, span);
    ol.append(li);
  }
}

const WALL_MODES = [
  { key: 'loop', label: 'Looping' },
  { key: 'live', label: 'Live' },
];

function renderWall() {
  const box = $('wall-modes');
  box.innerHTML = '';
  for (const m of WALL_MODES) {
    const btn = document.createElement('button');
    btn.className = 'wall__btn';
    btn.type = 'button';
    btn.textContent = m.label;
    btn.setAttribute('aria-pressed', String(m.key === wall.mode));
    btn.addEventListener('click', () => setWallMode(m.key));
    box.append(btn);
  }

  const since = wall.liveSince ? new Date(wall.liveSince).toLocaleTimeString() : null;
  $('wall-hint').textContent =
    wall.mode === 'live'
      ? `Rotation stopped. Only photos approved after ${since} reach the wall — the newest one holds the screen.`
      : 'The wall cycles every approved photo, one every 8 seconds.';
}

async function setWallMode(mode) {
  if (mode === wall.mode) return;
  wall = { mode, liveSince: mode === 'live' ? Date.now() : null };
  renderWall();
  try {
    wall = await api(at('/wall'), { method: 'POST', body: { mode } });
  } catch (err) {
    /* The next poll reconciles. */
  }
  renderWall();
}

async function decide(id, action) {
  const status = action === 'approve' ? 'approved' : 'rejected';
  // Reflect the decision immediately, then reconcile with the server.
  pendingDecisions.set(id, status);
  const target = submissions.find((s) => s.id === id);
  if (target) target.status = status;
  render();

  try {
    await api(at(`/submissions/${id}/${action}`), { method: 'POST' });
  } catch (err) {
    pendingDecisions.delete(id);
  }
  refresh();
}

/* ---- clear all ----
   Two clicks: the first arms the button, the second deletes. It disarms itself
   after 5s so a forgotten armed button can't be triggered by a stray click. */

const clearBtn = $('clear-btn');
const clearNote = $('clear-note');
const IDLE_LABEL = 'Clear all photos';
const IDLE_NOTE = 'Deletes every submission and its photo. Cannot be undone.';
let armed = false;
let armTimer = null;

function disarm() {
  clearTimeout(armTimer);
  armed = false;
  clearBtn.classList.remove('is-armed');
  clearBtn.textContent = IDLE_LABEL;
  clearNote.textContent = IDLE_NOTE;
}

clearBtn.addEventListener('click', async () => {
  if (!armed) {
    if (!submissions.length) {
      clearNote.textContent = 'Nothing to clear.';
      setTimeout(disarm, 2500);
      return;
    }
    armed = true;
    clearBtn.classList.add('is-armed');
    clearBtn.textContent = `Delete ${submissions.length} photo${submissions.length === 1 ? '' : 's'}?`;
    clearNote.textContent = 'Click again to confirm. This cannot be undone.';
    armTimer = setTimeout(disarm, 5000);
    return;
  }

  clearTimeout(armTimer);
  clearBtn.disabled = true;
  clearBtn.textContent = 'Clearing…';
  try {
    const { removed } = await api(at('/submissions'), { method: 'DELETE' });
    submissions = [];
    pendingDecisions.clear();
    render();
    renderQueue([]);
    disarm();
    clearNote.textContent = `Cleared ${removed} photo${removed === 1 ? '' : 's'}.`;
    setTimeout(disarm, 4000);
  } catch (err) {
    disarm();
    clearNote.textContent = 'Clearing failed — try again.';
  } finally {
    clearBtn.disabled = false;
  }
  refresh();
});

loadFilterState();
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
