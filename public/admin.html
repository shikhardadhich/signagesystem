<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderation — Selfie Wall</title>
<base href="/">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/admin.css">
<style>
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.6rem 1.5rem 5rem;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr);
    gap: 2rem;
    align-items: start;
  }

  /* The sidebar carries the wall's state and the clear-everything button —
     reference, not workflow. Below a laptop it goes under the queue rather
     than squeezing the rows it exists to describe. */
  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      gap: 1.4rem;
      padding: 1.2rem 1rem 4rem;
    }
  }

  .count {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
  }

  /* ---- automatic filter status ---- */

  .filter-note {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.82rem;
    line-height: 1.45;
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    margin: 0 0 var(--s4);
    background: var(--ok-soft);
    border: 1px solid rgba(31, 122, 77, 0.3);
    border-left: 3px solid var(--ok);
    color: var(--ink-soft);
  }

  /* Filter off means every photo here is unvetted — say so loudly. */
  .filter-note[data-state="off"] {
    background: var(--warn-soft);
    border-color: rgba(138, 90, 16, 0.35);
    border-left-color: var(--warn);
    color: #6d4708;
  }

  .filter-note b {
    color: var(--ink);
  }

  /* Per-row marker for the one case that matters: the filter is on, but this
     photo slipped through while it was unreachable. */
  .meta__unchecked {
    display: inline-block;
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #6d4708;
    background: var(--warn-soft);
    border: 1px solid rgba(138, 90, 16, 0.4);
    border-radius: var(--r-pill);
    padding: 0.15rem 0.55rem;
  }

  /* ---- filter tabs ---- */

  .tabs {
    display: flex;
    gap: var(--s2);
    margin: 0 0 var(--s4);
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.9rem;
    white-space: nowrap;
    flex: none;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-pill);
    background: #fff;
    color: var(--mocha);
    cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
      border-color var(--fast) var(--ease);
  }

  .tab:hover { border-color: var(--caramel); background: var(--card-sunk); }

  .tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .tab__n {
    font-size: 0.72rem;
    padding: 0.1rem 0.45rem;
    border-radius: var(--r-pill);
    background: var(--page-deep);
    color: var(--ink-soft);
  }

  .tab[aria-selected="true"] .tab__n {
    background: rgba(255, 255, 255, 0.22);
    color: var(--on-accent);
  }

  /* ---- submission rows ---- */

  .row {
    display: flex;
    gap: 1rem;
    align-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted);
    border-radius: 12px;
    padding: 0.85rem;
    margin-bottom: 0.85rem;
    box-shadow: var(--shadow-card);
    transition: box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease);
  }

  .row:hover {
    box-shadow: var(--shadow-lift);
  }

  /* Fades a row out the moment it is filtered away by a decision. */
  .row.is-leaving {
    opacity: 0;
    transform: translateX(12px);
  }

  /* Phone: the photo and who sent it share the top line, and the decision
     spans the full width underneath. Approve and Reject are the whole reason
     this page is open on a phone, so they get thumb-sized targets rather than
     two narrow buttons wedged beside a thumbnail. */
  @media (max-width: 620px) {
    .row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas: "thumb meta" "actions actions";
      gap: 0.75rem 0.9rem;
      align-items: start;
    }

    .thumb { grid-area: thumb; width: 84px; height: 105px; }
    .meta { grid-area: meta; }

    .actions {
      grid-area: actions;
      flex-direction: row;
      width: 100%;
    }

    .actions .btn { flex: 1; }
  }

  .row[data-status="pending"]  { border-left-color: var(--accent); }
  .row[data-status="approved"] { border-left-color: var(--ok); }
  .row[data-status="rejected"] { border-left-color: var(--bad); opacity: 0.65; }

  .thumb {
    width: 72px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--page-deep);
    flex: none;
    cursor: zoom-in;
    position: relative;
    transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }

  .thumb:hover,
  .thumb:focus-visible {
    transform: scale(1.04);
    box-shadow: var(--shadow-lift);
    outline: none;
  }

  /* ---- full-size viewer ----

     A 72px crop is enough to see that a photo exists and nowhere near enough to
     decide whether it should go on a wall in a room full of customers. The
     decision buttons come along into the viewer, because a moderator who has to
     close the photo to act on it ends up judging from the thumbnail again. */

  .viewer {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    background: rgba(10, 15, 21, 0.95);
    padding: 1rem;
    gap: 0.75rem;
  }

  .viewer.hidden { display: none; }

  .viewer__stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
  }

  .viewer__img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    background: #000;
    cursor: zoom-in;
  }

  /* Fills the frame and scrolls instead of fitting: at this point the moderator
     has decided the fitted view wasn't enough to tell. */
  .viewer.is-zoomed .viewer__stage {
    display: block;
    overflow: auto;
    place-items: initial;
  }

  .viewer.is-zoomed .viewer__img {
    max-width: none;
    max-height: none;
    width: auto;
    cursor: zoom-out;
    display: block;
    margin: 0 auto;
  }

  .viewer__spinner {
    position: absolute;
    color: rgba(248, 250, 252, 0.65);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .viewer__bar {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
    color: var(--cream);
    flex: none;
  }

  .viewer__who { min-width: 0; flex: 1; }

  .viewer__name {
    margin: 0;
    font-weight: 600;
    font-size: 1rem;
  }

  .viewer__message {
    margin: 0.15rem 0 0;
    font-size: 0.88rem;
    color: rgba(248, 250, 252, 0.72);
    overflow-wrap: anywhere;
  }

  .viewer__hint {
    margin: 0.15rem 0 0;
    font-size: 0.72rem;
    color: rgba(248, 250, 252, 0.45);
  }

  .viewer__nav {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .viewer__count {
    font-size: 0.8rem;
    color: rgba(248, 250, 252, 0.6);
    min-width: 4.5rem;
    text-align: center;
  }

  .viewer .btn {
    background: rgba(248, 250, 252, 0.1);
    border-color: rgba(248, 250, 252, 0.28);
    color: var(--cream);
  }

  .viewer .btn:hover:not(:disabled) { border-color: rgba(248, 250, 252, 0.6); }
  .viewer .btn--approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  .viewer .btn--reject { background: var(--bad); border-color: var(--bad); color: #fff; }

  .viewer__badge {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    background: rgba(248, 250, 252, 0.12);
  }

  @media (max-width: 560px) {
    .viewer__bar { gap: 0.5rem; }
    .viewer__who { flex-basis: 100%; }
  }

  .meta {
    flex: 1;
    min-width: 0;
  }

  .meta__name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0;
    color: var(--coffee);
  }

  .meta__message {
    font-style: italic;
    color: var(--mocha);
    margin: 0.2rem 0 0;
    font-size: 0.9rem;
    overflow-wrap: anywhere;
  }

  .meta__time {
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    flex: none;
  }

  .actions .btn {
    font-size: 0.82rem;
    padding: 0.5rem 0.95rem;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .badge[data-status="approved"] { background: rgba(78, 125, 63, 0.15); color: var(--ok); }
  .badge[data-status="rejected"] { background: rgba(162, 69, 47, 0.15); color: var(--bad); }

  /* ---- wall mode control ---- */

  .wall {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 1rem;
    box-shadow: var(--shadow-card);
    margin-bottom: var(--s5);
  }

  .wall__modes {
    display: flex;
    gap: var(--s2);
    margin-bottom: var(--s3);
  }

  .wall__btn {
    flex: 1;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.6rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: #fff;
    color: var(--mocha);
    cursor: pointer;
    min-height: 44px;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
      border-color var(--fast) var(--ease);
  }

  .wall__btn:hover:not([aria-pressed="true"]) {
    border-color: var(--gold);
  }

  .wall__btn[aria-pressed="true"] {
    background: var(--coffee);
    border-color: var(--coffee);
    color: var(--cream);
  }

  .wall__hint {
    margin: 0;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--muted);
  }

  /* ---- danger zone ---- */

  .danger {
    margin-top: var(--s5);
    padding-top: var(--s4);
    border-top: 1px dashed var(--line);
  }

  .danger__btn {
    width: 100%;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.65rem 0.5rem;
    min-height: 44px;
    border-radius: var(--r-sm);
    border: 1px solid var(--bad);
    background: #fff;
    color: var(--bad);
    cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }

  .danger__btn:hover:not(:disabled) {
    background: rgba(162, 69, 47, 0.08);
  }

  /* Second state: the click that actually deletes is visually distinct from
     the one that only arms it. */
  .danger__btn.is-armed {
    background: var(--bad);
    color: #fff;
  }

  .danger__btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .danger__note {
    margin: var(--s2) 0 0;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--muted);
  }

  /* ---- queue sidebar ---- */

  .queue {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 1rem;
    box-shadow: var(--shadow-card);
    position: sticky;
    /* Clears the sticky header rather than sliding under it. */
    top: calc(var(--top-h, 68px) + 1rem);
  }

  /* Stuck to nothing once it is stacked under the queue on a narrow screen. */
  @media (max-width: 900px) {
    .queue { position: static; }
  }

  .queue ol {
    list-style: none;
    counter-reset: slot;
    margin: 0;
    padding: 0;
  }

  .queue li {
    counter-increment: slot;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--line);
  }

  .queue li:last-child {
    border-bottom: none;
  }

  .queue li::before {
    content: counter(slot);
    flex: none;
    width: 1.6rem;
    height: 1.6rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 0.75rem;
    font-weight: 700;
  }

  .queue img {
    width: 30px;
    height: 38px;
    object-fit: cover;
    border-radius: 4px;
    flex: none;
  }

  .queue span {
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    margin: 0;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__inner">
    <h1 class="top__brand">Selfie Wall <span class="top__where" id="shell-where"></span></h1>
    <nav class="top__nav" id="shell-nav"></nav>
  </div>
</header>

<main>
  <section>
    <h2>Submissions <span class="count" id="sub-count">0</span></h2>
    <p class="filter-note hidden" id="filter-note"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="list" aria-live="polite"></div>
  </section>

  <aside>
  <section class="wall">
    <h2>Wall mode</h2>
    <div class="wall__modes" id="wall-modes"></div>
    <p class="wall__hint" id="wall-hint"></p>
  </section>

  <div class="queue">
    <h2>On the wall <span class="count" id="queue-count">0</span></h2>
    <ol id="queue"></ol>
    <p class="empty hidden" id="queue-empty">Nothing approved yet.</p>

    <div class="danger">
      <button class="danger__btn" type="button" id="clear-btn">Clear all photos</button>
      <p class="danger__note" id="clear-note">Deletes every submission and its photo. Cannot be undone.</p>
    </div>
  </div>
  </aside>
</main>

<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="Selfie at full size">
  <div class="viewer__stage" id="viewer-stage">
    <p class="viewer__spinner hidden" id="viewer-loading">Loading…</p>
    <img class="viewer__img" id="viewer-img" alt="">
  </div>
  <div class="viewer__bar">
    <div class="viewer__who">
      <p class="viewer__name" id="viewer-name"></p>
      <p class="viewer__message" id="viewer-message"></p>
      <p class="viewer__hint">Click the photo to zoom · ← → to move · Esc to close</p>
    </div>
    <div class="viewer__nav">
      <button class="btn btn--small" type="button" id="viewer-prev" aria-label="Previous photo">←</button>
      <span class="viewer__count" id="viewer-count"></span>
      <button class="btn btn--small" type="button" id="viewer-next" aria-label="Next photo">→</button>
    </div>
    <div class="viewer__nav" id="viewer-actions"></div>
    <button class="btn btn--small" type="button" id="viewer-close">Close</button>
  </div>
</div>

<script type="module">
import { shell, api, boot, flash } from '/admin-shell.js';

const POLL_MS = 6000;
const $ = (id) => document.getElementById(id);

const cafeId = location.pathname.split('/')[2];
/** Every call on this page is scoped to one cafe. */
const at = (suffix) => `/api/cafes/${cafeId}${suffix}`;

await boot({
  where: 'Moderation',
  nav: [
    { href: '/admin/cafes', label: 'Cafes', ownerOnly: true },
    { href: `/admin/${cafeId}`, label: 'Moderation' },
    { href: `/admin/${cafeId}/board`, label: 'Board' },
    { href: `/${cafeId}`, label: 'Screen ↗', blank: true },
    { href: `/${cafeId}/upload`, label: 'Upload ↗', blank: true },
    // The other kind of screen this deployment runs. It sits at the end
    // because it is a different site, not another view of this cafe.
    { href: '/admin/jewel', label: 'Jewellery' },
  ],
});

const cafe = shell.cafes.find((c) => c.id === cafeId);
if (cafe) $('shell-where').textContent = `${cafe.name} · Moderation`;

const FILTERS = [
  { key: 'pending', label: 'Needs review' },
  { key: 'approved', label: 'Approved' },
  { key: 'rejected', label: 'Rejected' },
  { key: 'all', label: 'All' },
];

let filter = 'pending';
let submissions = [];
let wall = { mode: 'loop', liveSince: null };
/* Whether the automatic filter is running. Fetched once — it comes from the
   server's environment and cannot change while the process is up. */
let autoFilter = null;
/* Ids the moderator just decided on, so a click updates instantly instead of
   waiting up to 3s for the next poll to catch up. */
const pendingDecisions = new Map();

async function refresh() {
  try {
    const [subs, queue, wallState] = await Promise.all([
      api(at('/submissions')),
      api(at('/queue')),
      api(at('/wall')),
    ]);
    wall = wallState;
    // Drop optimistic entries the server has now confirmed.
    for (const s of subs) {
      if (pendingDecisions.get(s.id) === s.status) pendingDecisions.delete(s.id);
    }
    submissions = subs.map((s) =>
      pendingDecisions.has(s.id) ? { ...s, status: pendingDecisions.get(s.id) } : s
    );
    render();
    renderQueue(queue);
    renderWall();
  } catch (err) {
    /* Leave the last good render on screen and retry next tick. */
  }
}

function counts() {
  const n = { all: submissions.length, pending: 0, approved: 0, rejected: 0 };
  for (const s of submissions) n[s.status] = (n[s.status] || 0) + 1;
  return n;
}

function render() {
  renderTabs();
  renderSubmissions();
  // The viewer is a view of the same list, so it follows every poll and every
  // decision rather than sitting on a stale copy behind them.
  if (viewing !== null) paintViewer();
}

/**
 * Says plainly whether anything was screened before it got here. A moderator
 * who assumes an automatic filter that is switched off is the failure mode
 * worth spending a banner on.
 */
async function loadFilterState() {
  try {
    const health = await api('/api/health');
    autoFilter = health.moderation || { enabled: false };
  } catch (err) {
    return;
  }

  const note = $('filter-note');
  note.dataset.state = autoFilter.enabled ? 'on' : 'off';
  note.textContent = autoFilter.enabled
    ? 'Names, messages and photos are screened automatically before they reach this page. Flagged uploads are refused and never appear here — you are the second pass, not the first.'
    : 'Automatic screening is off, so nothing below has been checked. Every photo needs your eyes.';
  note.classList.remove('hidden');
  render();
}

function renderTabs() {
  const n = counts();
  const tabs = $('tabs');
  tabs.innerHTML = '';
  for (const f of FILTERS) {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(f.key === filter));
    btn.append(f.label);
    const badge = document.createElement('span');
    badge.className = 'tab__n';
    badge.textContent = n[f.key] || 0;
    btn.append(badge);
    btn.addEventListener('click', () => { filter = f.key; render(); });
    tabs.append(btn);
  }
}

/** What the current tab is showing, in the order it is shown. */
const visible = () => submissions.filter((s) => filter === 'all' || s.status === filter);

function renderSubmissions() {
  $('sub-count').textContent = submissions.length;
  const list = $('list');
  const shown = visible();

  if (!shown.length) {
    const EMPTY = {
      pending: 'All caught up — nothing waiting for review.',
      approved: 'Nothing approved yet.',
      rejected: 'Nothing rejected.',
      all: 'No submissions yet — open the upload page and send one through.',
    };
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = submissions.length ? EMPTY[filter] : EMPTY.all;
    list.replaceChildren(p);
    return;
  }

  list.innerHTML = '';
  for (const item of shown) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.status = item.status;

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = item.url;
    thumb.loading = 'lazy';
    thumb.alt = `Selfie from ${item.name}`;
    thumb.tabIndex = 0;
    thumb.title = 'Click to see it full size';
    thumb.addEventListener('click', () => openViewer(item.id));
    // Keyboard-reachable too: moderating a busy queue is a keyboard job, and a
    // control only the mouse can reach makes it a two-handed one.
    thumb.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(item.id); }
    });

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('p');
    name.className = 'meta__name';
    name.textContent = item.name;
    const message = document.createElement('p');
    message.className = 'meta__message';
    message.textContent = item.message || '—';
    const time = document.createElement('p');
    time.className = 'meta__time';
    time.textContent = new Date(item.submittedAt).toLocaleTimeString();
    meta.append(name, message, time);

    /* Only when the filter is meant to be running. With it off the banner
       already says nothing was checked, and a badge on every row is noise. */
    if (autoFilter?.enabled && item.moderation && item.moderation.checked === false) {
      const warn = document.createElement('p');
      warn.className = 'meta__unchecked';
      warn.textContent = '⚠ arrived unscreened';
      warn.title = `The automatic filter could not check this one (${describeSkips(item.moderation)}), so it came through unverified.`;
      meta.append(warn);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (item.status === 'pending') {
      actions.append(
        button('Approve', 'btn--approve', () => decide(item.id, 'approve')),
        button('Reject', 'btn--reject', () => decide(item.id, 'reject')),
      );
    } else {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.dataset.status = item.status;
      badge.textContent = item.status;
      actions.append(badge);
    }

    row.append(thumb, meta, actions);
    list.append(row);
  }
}

const SKIP_COPY = {
  timeout: 'the check timed out',
  network: 'the filter was unreachable',
  'bad-response': 'the filter returned nothing usable',
  'too-large': 'the photo was too big to send',
  'unsupported-type': 'that image format cannot be screened',
  'no-api-key': 'no API key was configured',
};

function describeSkips(moderation) {
  const skipped = moderation.skipped || [];
  if (!skipped.length) return 'reason not recorded';
  return skipped
    .map((s) => SKIP_COPY[s.reason] || (s.reason.startsWith('http-') ? `the filter returned ${s.reason.slice(5)}` : s.reason))
    .join('; ');
}

function button(label, variant, onClick) {
  const btn = document.createElement('button');
  btn.className = `btn ${variant}`;
  btn.type = 'button';
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function renderQueue(queue) {
  $('queue-count').textContent = queue.length;
  $('queue-empty').classList.toggle('hidden', queue.length > 0);

  const ol = $('queue');
  ol.innerHTML = '';
  for (const item of queue) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.src = item.url;
    img.loading = 'lazy';
    img.alt = '';
    const span = document.createElement('span');
    span.textContent = item.name;
    li.append(img, span);
    ol.append(li);
  }
}

const WALL_MODES = [
  { key: 'loop', label: 'Looping' },
  { key: 'live', label: 'Live' },
];

function renderWall() {
  const box = $('wall-modes');
  box.innerHTML = '';
  for (const m of WALL_MODES) {
    const btn = document.createElement('button');
    btn.className = 'wall__btn';
    btn.type = 'button';
    btn.textContent = m.label;
    btn.setAttribute('aria-pressed', String(m.key === wall.mode));
    btn.addEventListener('click', () => setWallMode(m.key));
    box.append(btn);
  }

  const since = wall.liveSince ? new Date(wall.liveSince).toLocaleTimeString() : null;
  $('wall-hint').textContent =
    wall.mode === 'live'
      ? `Rotation stopped. Only photos approved after ${since} reach the wall — the newest one holds the screen.`
      : 'The wall cycles every approved photo, one every 8 seconds.';
}

async function setWallMode(mode) {
  if (mode === wall.mode) return;
  wall = { mode, liveSince: mode === 'live' ? Date.now() : null };
  renderWall();
  try {
    wall = await api(at('/wall'), { method: 'POST', body: { mode } });
  } catch (err) {
    /* The next poll reconciles. */
  }
  renderWall();
}

/* ---- full-size viewer ----

   Opened by id rather than by index: the list re-renders under it every few
   seconds as the queue polls, and an index would silently start pointing at
   somebody else's photo. */

let viewing = null;
/* Where the open photo sat in the list, so that deciding on it can fall
   through to whatever takes its place rather than to the top of the queue. */
let lastIndex = 0;
/** The photo currently in the frame, so repaints don't re-fetch it. */
let shownUrl = null;

function openViewer(id) {
  viewing = id;
  $('viewer').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  paintViewer();
}

function closeViewer() {
  viewing = null;
  shownUrl = null;
  $('viewer').classList.remove('is-zoomed');
  $('viewer').classList.add('hidden');
  document.body.style.overflow = '';
}

function paintViewer() {
  const list = visible();
  const index = list.findIndex((s) => s.id === viewing);

  /* The photo that was open has been filtered away — usually because deciding
     on it moved it off the Pending tab. Show the next one in its place rather
     than closing: the moderator is working through a queue, and the whole
     point of deciding from here is not having to reopen the next photo. */
  if (index === -1) {
    if (!list.length) return closeViewer();
    viewing = list[Math.min(lastIndex, list.length - 1)].id;
    return paintViewer();
  }
  lastIndex = index;

  const item = list[index];
  const img = $('viewer-img');
  /* Compared against a remembered value rather than img.src: the browser
     resolves that to an absolute URL, so it would never equal the relative one
     in the record and the photo would reload on every six-second poll —
     flickering under a moderator mid-decision. */
  if (shownUrl !== item.url) {
    shownUrl = item.url;
    $('viewer-loading').classList.remove('hidden');
    img.addEventListener('load', () => $('viewer-loading').classList.add('hidden'), { once: true });
    img.addEventListener('error', () => {
      $('viewer-loading').textContent = 'This photo could not be loaded.';
    }, { once: true });
    img.src = item.url;
    img.alt = `Selfie from ${item.name}`;
    $('viewer').classList.remove('is-zoomed');
  }

  $('viewer-name').textContent = item.name;
  $('viewer-message').textContent = item.message || '—';
  $('viewer-count').textContent = `${index + 1} of ${list.length}`;
  $('viewer-prev').disabled = index === 0;
  $('viewer-next').disabled = index === list.length - 1;

  const actions = $('viewer-actions');
  actions.replaceChildren();
  if (item.status === 'pending') {
    actions.append(
      button('Approve', 'btn--approve', () => decide(item.id, 'approve')),
      button('Reject', 'btn--reject', () => decide(item.id, 'reject')),
    );
  } else {
    const badge = document.createElement('span');
    badge.className = 'viewer__badge';
    badge.textContent = item.status;
    actions.append(badge);
  }
}

function stepViewer(delta) {
  const list = visible();
  const index = list.findIndex((s) => s.id === viewing);
  const next = list[index + delta];
  if (!next) return;
  viewing = next.id;
  paintViewer();
}

$('viewer-close').addEventListener('click', closeViewer);
$('viewer-prev').addEventListener('click', () => stepViewer(-1));
$('viewer-next').addEventListener('click', () => stepViewer(1));
$('viewer-img').addEventListener('click', () => $('viewer').classList.toggle('is-zoomed'));

// Clicking the backdrop closes; clicking the photo zooms. Without the target
// check, every attempt to zoom would shut the thing instead.
$('viewer').addEventListener('click', (e) => {
  if (e.target === $('viewer') || e.target === $('viewer-stage')) closeViewer();
});

window.addEventListener('keydown', (e) => {
  if (viewing === null) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') stepViewer(-1);
  else if (e.key === 'ArrowRight') stepViewer(1);
  else if (e.key === 'a' || e.key === 'A') decideVisible('approve');
  else if (e.key === 'r' || e.key === 'R') decideVisible('reject');
});

/** Keyboard shortcuts only act on a photo still awaiting a decision. */
function decideVisible(action) {
  const item = visible().find((s) => s.id === viewing);
  if (item && item.status === 'pending') decide(item.id, action);
}

async function decide(id, action) {
  const status = action === 'approve' ? 'approved' : 'rejected';
  // Reflect the decision immediately, then reconcile with the server.
  pendingDecisions.set(id, status);
  const target = submissions.find((s) => s.id === id);
  if (target) target.status = status;
  render();

  try {
    await api(at(`/submissions/${id}/${action}`), { method: 'POST' });
  } catch (err) {
    pendingDecisions.delete(id);
  }
  refresh();
}

/* ---- clear all ----
   Two clicks: the first arms the button, the second deletes. It disarms itself
   after 5s so a forgotten armed button can't be triggered by a stray click. */

const clearBtn = $('clear-btn');
const clearNote = $('clear-note');
const IDLE_LABEL = 'Clear all photos';
const IDLE_NOTE = 'Deletes every submission and its photo. Cannot be undone.';
let armed = false;
let armTimer = null;

function disarm() {
  clearTimeout(armTimer);
  armed = false;
  clearBtn.classList.remove('is-armed');
  clearBtn.textContent = IDLE_LABEL;
  clearNote.textContent = IDLE_NOTE;
}

clearBtn.addEventListener('click', async () => {
  if (!armed) {
    if (!submissions.length) {
      clearNote.textContent = 'Nothing to clear.';
      setTimeout(disarm, 2500);
      return;
    }
    armed = true;
    clearBtn.classList.add('is-armed');
    clearBtn.textContent = `Delete ${submissions.length} photo${submissions.length === 1 ? '' : 's'}?`;
    clearNote.textContent = 'Click again to confirm. This cannot be undone.';
    armTimer = setTimeout(disarm, 5000);
    return;
  }

  clearTimeout(armTimer);
  clearBtn.disabled = true;
  clearBtn.textContent = 'Clearing…';
  try {
    const { removed } = await api(at('/submissions'), { method: 'DELETE' });
    submissions = [];
    pendingDecisions.clear();
    render();
    renderQueue([]);
    disarm();
    clearNote.textContent = `Cleared ${removed} photo${removed === 1 ? '' : 's'}.`;
    setTimeout(disarm, 4000);
  } catch (err) {
    disarm();
    clearNote.textContent = 'Clearing failed — try again.';
  } finally {
    clearBtn.disabled = false;
  }
  refresh();
});

loadFilterState();
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
