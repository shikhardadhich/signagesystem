<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the Selfie Wall</title>
<base href="/">
<link rel="stylesheet" href="/theme.css">
<style>
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #543421 0%, transparent 55%),
      linear-gradient(180deg, var(--coffee) 0%, var(--espresso) 100%);
    min-height: 100vh;
    padding:
      calc(var(--s5) + env(safe-area-inset-top)) calc(var(--s4) + env(safe-area-inset-right))
      calc(var(--s6) + env(safe-area-inset-bottom)) calc(var(--s4) + env(safe-area-inset-left));
    color: var(--cream);
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .crest {
    width: 62px;
    height: 62px;
    margin-bottom: 0.4rem;
  }

  .brand {
    font-family: var(--serif);
    font-size: 1.6rem;
    margin: 0;
    color: var(--cream);
  }

  .brand em {
    color: var(--gold-light);
    font-style: normal;
  }

  .tagline {
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .card {
    background: rgba(247, 239, 225, 0.06);
    border: 1px solid rgba(201, 151, 63, 0.35);
    border-radius: 16px;
    padding: 1.25rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin: 0 0 0.4rem;
  }

  .field + .field {
    margin-top: 1.1rem;
  }

  input[type="text"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 1rem;
    padding: 0.8rem 0.9rem;
    border-radius: 10px;
    border: 1px solid rgba(201, 151, 63, 0.4);
    background: var(--cream);
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .counter {
    font-size: 0.72rem;
    color: rgba(247, 239, 225, 0.55);
    text-align: right;
    margin: 0.35rem 0 0;
    transition: color var(--fast) var(--ease);
  }

  /* Warns before the maxlength silently swallows keystrokes. */
  .counter.is-near {
    color: var(--gold-light);
  }

  .counter.is-full {
    color: #f0a08c;
    font-weight: 600;
  }

  /* Big tappable file picker; the real input is hidden behind it. */
  .picker {
    display: block;
    text-align: center;
    padding: 1.4rem 1rem;
    border: 2px dashed rgba(201, 151, 63, 0.6);
    border-radius: 12px;
    background: rgba(201, 151, 63, 0.08);
    cursor: pointer;
    transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease);
  }

  .picker:hover {
    background: rgba(201, 151, 63, 0.14);
  }

  .picker.has-file {
    border-style: solid;
    border-color: var(--gold);
    background: rgba(201, 151, 63, 0.18);
  }

  .picker span {
    display: block;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--cream);
    text-transform: none;
    letter-spacing: 0;
  }

  .picker small {
    color: rgba(247, 239, 225, 0.6);
    font-size: 0.8rem;
  }

  .picker .shrunk {
    color: var(--gold-light);
  }

  input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  .preview {
    margin-top: var(--s5);
    text-align: center;
    animation: rise var(--slow) var(--ease) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .preview__label {
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.75rem;
  }

  /* Same frame the wall uses, scaled down for the phone. */
  #preview-frame {
    --u: 0.7px;
    width: 230px;
    margin: 0 auto;
  }

  .btn--primary {
    width: 100%;
    margin-top: 1.5rem;
    font-size: 1.05rem;
    padding: 1rem;
  }

  .error__detail {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.75rem;
    opacity: 0.75;
    word-break: break-word;
  }

  /* Points at the field the filter objected to, so "try a different one"
     doesn't leave someone re-reading the whole form. */
  input.is-flagged,
  .picker.is-flagged {
    border-color: var(--bad);
    box-shadow: 0 0 0 3px rgba(162, 69, 47, 0.28);
  }

  /* ---- consent ---- */

  /* A real checkbox, unticked, sitting between the person and the button. Not
     a line of small print under it: what is being agreed to is that a stranger's
     face goes on a screen in a public room, and that deserves a deliberate act
     rather than something they are deemed to have accepted by proceeding. */
  .consent {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    margin-top: 1.4rem;
    padding: 0.9rem;
    border-radius: 12px;
    background: rgba(247, 239, 225, 0.06);
    border: 1px solid rgba(201, 151, 63, 0.3);
    font-size: 0.88rem;
    line-height: 1.5;
    cursor: pointer;
  }

  /* Comfortably past the 44px minimum: this is the one control on the page a
     person might feel nudged past, so it should be hard to miss and easy to hit. */
  .consent input {
    width: 1.4rem;
    height: 1.4rem;
    margin: 0.1rem 0 0;
    flex: none;
    accent-color: var(--gold);
  }

  .consent small {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.76rem;
    color: rgba(247, 239, 225, 0.6);
  }

  .consent.is-flagged {
    border-color: var(--bad);
    background: rgba(162, 69, 47, 0.18);
  }

  /* How long the scanned code has left. Quiet until it matters. */
  .expiry {
    margin: 0.8rem 0 0;
    font-size: 0.78rem;
    text-align: center;
    color: rgba(247, 239, 225, 0.55);
  }

  .expiry.is-urgent { color: var(--gold-light); }
  .expiry.is-dead { color: var(--bad); font-size: 0.9rem; }

  .error {
    margin: 0.9rem 0 0;
    padding: 0.7rem 0.9rem;
    border-radius: 10px;
    background: rgba(162, 69, 47, 0.25);
    border: 1px solid var(--bad);
    font-size: 0.9rem;
  }

  /* ---- confirmation view ---- */

  .done {
    text-align: center;
    animation: rise var(--slow) var(--ease) both;
  }

  .done__badge {
    font-size: 3.4rem;
    line-height: 1;
  }

  .done__title {
    font-family: var(--serif);
    font-size: 1.7rem;
    margin: 0.75rem 0 0.35rem;
    color: var(--gold-light);
  }

  .done__position {
    font-size: 1rem;
    color: rgba(247, 239, 225, 0.8);
    margin: 0;
  }

  .status {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 12px;
    border: 1px solid rgba(201, 151, 63, 0.35);
    background: rgba(0, 0, 0, 0.2);
  }

  .status__pill {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    background: var(--gold);
    color: var(--espresso);
    font-weight: 700;
  }

  .status__pill[data-status="approved"] { background: var(--ok); color: #fff; }
  .status__pill[data-status="rejected"] { background: var(--bad); color: #fff; }

  .status__text {
    margin: 0.8rem 0 0;
    font-size: 0.92rem;
    color: rgba(247, 239, 225, 0.8);
    line-height: 1.45;
  }

</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="crest" id="crest" src="/assets/emblem.png" alt="">
    <h1 class="brand" id="brand"><span id="cafe-name">Selfie Wall</span></h1>
    <p class="tagline">Get on the big screen</p>
  </header>

  <!-- ---------- form ---------- -->
  <form id="form" class="card" autocomplete="off">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" maxlength="40" placeholder="Ada" required>
    </div>

    <div class="field">
      <label for="message">Message <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
      <input id="message" name="message" type="text" maxlength="100" placeholder="Best flat white in town ☕">
      <p class="counter"><span id="msg-count">0</span>/100</p>
    </div>

    <div class="field">
      <label class="picker" for="photo">
        <span id="picker-text">📷 Tap to take or choose a photo</span>
        <small id="picker-note">JPG, PNG or WEBP · up to 12&nbsp;MB</small>
      </label>
      <input id="photo" name="photo" type="file" accept="image/*" capture="user" required>
    </div>

    <div class="preview hidden" id="preview">
      <p class="preview__label">Here's how you'll look on the wall</p>
      <div id="preview-frame" class="template">
        <img id="preview-photo" class="template__photo" alt="Preview of your selfie">
        <div class="template__caption">
          <p id="preview-name" class="template__name">Your name</p>
          <p id="preview-message" class="template__message"></p>
        </div>
      </div>
    </div>

    <label class="consent" for="consent">
      <input id="consent" name="consent" type="checkbox" value="yes" required>
      <span>
        I agree to my photo, name and message being shown on the screens in this
        cafe, and confirm this is a photo of me.
        <small>Staff review every photo before it appears. Ask any staff member to
        remove yours and it comes down.</small>
      </span>
    </label>

    <button type="submit" class="btn btn--primary" id="submit">Send it to the wall</button>
    <p class="error hidden" id="error" role="alert"></p>
    <p class="expiry hidden" id="expiry"></p>
  </form>

  <!-- ---------- confirmation ---------- -->
  <div class="card done hidden" id="done">
    <div class="done__badge">🎉</div>
    <h2 class="done__title">You're in the queue!</h2>
    <p class="done__position" id="position">Position: —</p>

    <div class="status">
      <span class="status__pill" id="pill">Pending</span>
      <p class="status__text" id="status-text">Hang tight — our barista is reviewing your photo.</p>
    </div>
  </div>

</div>

<script>
const POLL_MS = 5000;

const $ = (id) => document.getElementById(id);
const form = $('form');
let statusTimer = null;

/* /<cafe>/upload — the QR code on each screen points at its own cafe, so the
   phone knows which wall it is joining without the customer choosing. */
const CAFE_ID = location.pathname.split('/').filter(Boolean)[0];
const at = (suffix) => `/api/cafes/${CAFE_ID}${suffix}`;

/* The phone page wears the cafe's branding: someone who scanned a code in one
   cafe should not see another's name on their screen. */
fetch(at('/board'))
  .then((r) => r.json())
  .then((board) => {
    if (board.name) {
      $('cafe-name').textContent = `${board.name} — Selfie Wall`;
      document.title = `Join the Selfie Wall — ${board.name}`;
    }
    // The tagline slot keeps its instruction ("Get on the big screen") — on a
    // phone that is what the person needs, not the cafe's motto.
    if (board.logo) $('crest').src = board.logo;
  })
  .catch(() => {});

/* ---- the scanned pass ----

   The QR code carries a short-lived pass, so a photo of the screen taken on
   the way out stops working. The server is what enforces that — a countdown a
   page runs is a countdown the person can edit — but the page still shows it,
   because "expired" arriving only after you have taken a selfie and typed a
   message is a rotten way to find out. */

const PASS = new URLSearchParams(location.search).get('p') || '';
const passExpiry = Number(PASS.split('.')[0]) * 1000;
let expiryTimer = null;

function passSecondsLeft() {
  if (!PASS || !Number.isFinite(passExpiry)) return null;
  return Math.max(0, Math.round((passExpiry - Date.now()) / 1000));
}

function tickExpiry() {
  const left = passSecondsLeft();
  const note = $('expiry');
  if (left === null) return;                 // no pass in the URL: server decides

  if (left <= 0) {
    note.className = 'expiry is-dead';
    note.textContent = 'This code has expired. Scan the QR code on the screen again.';
    $('submit').disabled = true;
    $('submit').textContent = 'Scan the code again';
    clearInterval(expiryTimer);
    return;
  }

  const mins = Math.floor(left / 60);
  const secs = String(left % 60).padStart(2, '0');
  note.className = left <= 60 ? 'expiry is-urgent' : 'expiry';
  note.textContent = `This code is good for another ${mins}:${secs}`;
  note.classList.remove('hidden');
}

if (PASS) {
  tickExpiry();
  expiryTimer = setInterval(tickExpiry, 1000);
}

/* ---- live preview ---- */

$('name').addEventListener('input', (e) => {
  $('preview-name').textContent = e.target.value.trim() || 'Your name';
});

$('message').addEventListener('input', (e) => {
  const value = e.target.value;
  const counter = $('msg-count').parentElement;
  $('msg-count').textContent = value.length;
  counter.classList.toggle('is-near', value.length >= 80 && value.length < 100);
  counter.classList.toggle('is-full', value.length >= 100);
  $('preview-message').textContent = value.trim();
  $('preview-message').style.display = value.trim() ? '' : 'none';
});

/* ---- keeping the photo whole ----

   The selfie ends up filling most of a wall-mounted TV, so it is sent exactly
   as the camera produced it. This page used to downscale every photo to a
   1600px edge, which was invisible on a 1080p screen and soft on a 4K one —
   the wrong saving to make on the one image the whole wall is built around.

   The only ceiling left is the server's upload limit, and a photo is reduced
   solely to get under it. That limit is not arbitrary: the automatic filter
   inspects the image as a data URL, and an oversized one would be waved
   through unscreened. Everything that can be uploaded can be checked. */

const LIMIT = 12 * 1024 * 1024;
/* Steps tried in order until one fits. Full size at near-lossless quality
   first, so a photo only loses pixels once losing bytes has stopped working. */
const FALLBACKS = [
  { edge: Infinity, quality: 0.95 },
  { edge: Infinity, quality: 0.88 },
  { edge: 4096, quality: 0.9 },
  { edge: 3000, quality: 0.88 },
  { edge: 2200, quality: 0.85 },
];

/** The processed file to submit, or null to send the original untouched. */
let prepared = null;
let reduced = false;

const kb = (n) => (n < 1024 * 1024 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`);

async function fitToLimit(file) {
  if (file.size <= LIMIT) return null;                // send it as it came

  // imageOrientation honours EXIF, so portrait phone shots aren't rotated.
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const canvas = document.createElement('canvas');

  try {
    for (const { edge, quality } of FALLBACKS) {
      const scale = Math.min(1, edge / Math.max(bitmap.width, bitmap.height));
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);

      const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', quality));
      if (blob && blob.size <= LIMIT) {
        return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
      }
    }
    return null;   // nothing fit; let the server say so rather than guessing
  } finally {
    bitmap.close?.();
  }
}

$('photo').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  document.querySelector('.picker').classList.add('has-file');
  $('picker-text').textContent = `📷 ${file.name}`;
  $('picker-note').textContent = 'Preparing…';
  $('preview').classList.remove('hidden');
  $('preview-name').textContent = $('name').value.trim() || 'Your name';

  prepared = null;
  reduced = false;
  try {
    prepared = await fitToLimit(file);
    reduced = Boolean(prepared);
  } catch (err) {
    // Unsupported format or a browser without createImageBitmap: send as-is
    // and let the server's limit have the last word.
  }

  const used = prepared || file;
  $('preview-photo').src = URL.createObjectURL(used);
  $('picker-note').innerHTML = reduced
    ? `<span class="shrunk">${kb(file.size)} → ${kb(used.size)}</span> · trimmed to fit the upload limit`
    : `${kb(file.size)} · full quality`;
});

/* ---- submit ---- */

/* ---- flagged-field highlight ---- */

const FLAGGABLE = {
  name: () => $('name'),
  message: () => $('message'),
  photo: () => document.querySelector('.picker'),
  consent: () => document.querySelector('.consent'),
};

function clearFlags() {
  for (const get of Object.values(FLAGGABLE)) get()?.classList.remove('is-flagged');
}

function flagField(field) {
  const el = FLAGGABLE[field]?.();
  if (!el) return;
  el.classList.add('is-flagged');
  el.focus?.();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Editing a flagged field clears its mark — the next attempt starts clean.
for (const id of ['name', 'message']) $(id).addEventListener('input', () => $(id).classList.remove('is-flagged'));
$('photo').addEventListener('change', () => document.querySelector('.picker').classList.remove('is-flagged'));
$('consent').addEventListener('change', () => document.querySelector('.consent').classList.remove('is-flagged'));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  $('error').classList.add('hidden');
  clearFlags();
  $('submit').disabled = true;
  $('submit').innerHTML = '<span class="spinner"></span>Sending…';

  try {
    const body = new FormData(form);
    // Submit the downscaled copy rather than what came off the camera.
    if (prepared) body.set('photo', prepared, prepared.name);
    // Carried from the URL the QR code opened. The server re-checks the
    // signature and the clock; this only gets it there.
    body.set('pass', PASS);
    const res = await fetch(at('/upload'), { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) {
      // Carry the operator-facing detail alongside the friendly message; the
      // person debugging the wall is usually the person holding the phone.
      const err = new Error(data.error || 'Upload failed');
      err.detail = [data.storage, data.detail].filter(Boolean).join(' · ');
      // A moderation refusal is the person's to fix, not the operator's — no
      // storage diagnostics, just a pointer at the field that tripped.
      if (data.moderation === 'blocked') {
        err.detail = '';
        err.field = data.field;
      }
      if (data.field) err.field = data.field;
      if (data.pass) { err.detail = ''; err.pass = data.pass; }
      throw err;
    }

    form.classList.add('hidden');
    $('done').classList.remove('hidden');
    $('position').textContent = `Position: ${data.position}`;
    trackStatus(data.id);
  } catch (err) {
    $('error').textContent = err.message;
    if (err.detail) {
      const small = document.createElement('small');
      small.className = 'error__detail';
      small.textContent = err.detail;
      $('error').append(small);
    }
    $('error').classList.remove('hidden');
    if (err.field) flagField(err.field);
    // A dead pass is not something a second tap fixes, so the button stays
    // down and tickExpiry keeps saying why.
    if (err.pass) return tickExpiry();
    $('submit').disabled = false;
    $('submit').textContent = 'Send it to the wall';
  }
});

/* ---- status polling ---- */

function trackStatus(id) {
  const check = async () => {
    try {
      const data = await (await fetch(at(`/status/${id}`))).json();
      renderStatus(data);
      if (data.status !== 'pending') clearInterval(statusTimer);
    } catch (err) {
      /* Retry on the next tick. */
    }
  };
  check();
  statusTimer = setInterval(check, POLL_MS);
}

function renderStatus(data) {
  const pill = $('pill');
  pill.dataset.status = data.status;

  if (data.status === 'pending') {
    pill.textContent = 'Pending';
    $('position').textContent = `Position: ${data.position}`;
    $('status-text').textContent = 'Hang tight — our barista is reviewing your photo.';
    return;
  }

  if (data.status === 'approved') {
    pill.textContent = 'On the wall';
    $('position').textContent = `Slot ${data.queuePosition} of ${data.queueLength} in the rotation`;
    $('status-text').textContent = "You're live! Look up at the screen — your selfie is in the rotation.";
    return;
  }

  pill.textContent = 'Not this time';
  $('position').textContent = '';
  $('status-text').textContent = "This one didn't make the wall. Feel free to snap another and try again.";
}
</script>
</body>
</html>
